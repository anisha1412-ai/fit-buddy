<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Workout Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="/static/css/loading.css" rel="stylesheet">
    <script src="/static/js/loading.js" defer></script>
    <style>
        * { box-sizing: border-box; }

        /* Full-bleed gym background with a dark overlay for readability.
           Falls back to a dark gradient if gym-bg.jpg is missing. */
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
            color: #f1f5f9;
            background:
                linear-gradient(rgba(10, 15, 25, 0.65), rgba(10, 15, 25, 0.65)),
                url("/static/images/gym-bg.jpg") center / cover no-repeat fixed,
                linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: rgba(20, 27, 40, 0.88);
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            padding: 32px 30px;
        }

        h1 {
            margin: 0 0 22px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .field {
            display: flex;
            flex-direction: column;
            margin-bottom: 14px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input, select {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 0.95rem;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: #2563eb; transform: translateY(-1px); }

        .error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid #dc2626;
            color: #fecaca;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #93c5fd;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .footer-link:hover { text-decoration: underline; }

        /* Narrow screens: tighter padding, smaller heading */
        @media (max-width: 480px) {
            .card { padding: 24px 18px; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>💪 FitBuddy - AI Workout Generator</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/generate-workout" method="post"
              data-loading-title="Building your plan..."
              data-loading-button="Generating..."
              data-loading-steps="Validating your details|Creating your 7-day workout plan (Gemini Pro)|Writing a nutrition tip (Gemini Flash)|Saving your plan"
              data-loading-step-ms="5000"
              data-loading-note="AI generation usually takes 10–30 seconds. Please keep this page open.">
            <div class="field">
                <label for="username">Name:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="field">
                <label for="user_id">User ID:</label>
                <input type="number" id="user_id" name="user_id" min="1" required>
            </div>
            <div class="field">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="1" max="120" required>
            </div>
            <div class="field">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" name="weight" min="1" step="0.1" required>
            </div>
            <div class="field">
                <label for="goal">Fitness Goal:</label>
                <input type="text" id="goal" name="goal" placeholder="e.g., weight loss, flexibility" required>
            </div>
            <div class="field">
                <label for="intensity">Workout Intensity:</label>
                <select id="intensity" name="intensity">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <button type="submit">Generate Plan</button>
        </form>

        <a class="footer-link" href="/view-all-users" data-loading-title="Loading all users...">📋 View all users (admin)</a>
    </div>
</body>
</html>
